<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>샘플 · 한눈에 보기 (노드-연결 맵)</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
  :root{
    --bg:#eaeefb;--ink:#33384f;--ink-dim:#6b7193;--ink-faint:#a3a9c6;--card:#f4f6fd;
    --b1:#7e9bff;--b1-deep:#4f6ee0;--b2:#62c6e8;--b2-deep:#2f9cc4;--b3:#b18cf0;--b3-deep:#8559d8;
    --grad:linear-gradient(120deg,#8aa4ff,#c9a8ff 55%,#f5b8d0);
    --sh:8px 8px 22px rgba(176,186,224,0.55),-8px -8px 22px rgba(255,255,255,0.9);
    --sh-sm:5px 5px 14px rgba(176,186,224,0.5),-5px -5px 14px rgba(255,255,255,0.9);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;font-family:"Pretendard",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
  body{background:#dde3f5;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}

  .slide{position:relative;width:min(94vw,calc(88vh*16/9));aspect-ratio:16/9;border-radius:30px;overflow:hidden;
    background:radial-gradient(80% 70% at 85% -10%,#eef1fe,transparent 60%),radial-gradient(70% 70% at 0% 110%,#f3ecfb,transparent 55%),var(--bg);
    box-shadow:14px 14px 40px rgba(150,160,210,0.5),-14px -14px 40px rgba(255,255,255,0.85);
    padding:48px 56px;display:flex;flex-direction:column}
  /* subtle dotted grid like reference */
  .slide::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(140,150,200,.16) 1px,transparent 1px);background-size:22px 22px;opacity:.5;z-index:0}

  .eyebrow{font-size:13px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;margin-bottom:10px;
    background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;z-index:2}
  h2.head{font-size:30px;font-weight:800;letter-spacing:-.02em;z-index:2}
  .sub{font-size:15px;color:var(--ink-dim);margin-top:8px;z-index:2}

  .map{position:relative;flex:1;margin-top:18px;z-index:2}
  svg.links{position:absolute;inset:0;width:100%;height:100%;overflow:visible;z-index:1}
  svg.links path{fill:none;stroke-width:2.4;stroke-linecap:round;opacity:.55;vector-effect:non-scaling-stroke}
  /* dash draw animation */
  svg.links path{stroke-dasharray:600;stroke-dashoffset:600;animation:draw 1.1s ease forwards}
  @keyframes draw{to{stroke-dashoffset:0}}

  .node{position:absolute;transform:translate(-50%,-50%);z-index:2}
  /* root */
  .root{background:var(--card);border-radius:20px;padding:18px 22px;box-shadow:var(--sh);text-align:center;width:170px}
  .root .lbl{font-size:12px;font-weight:800;letter-spacing:.04em;color:var(--ink-faint);text-transform:uppercase}
  .root .ttl{font-size:20px;font-weight:800;margin-top:4px}
  .root .ttl .g{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

  /* brand node */
  .brand{background:var(--card);border-radius:16px;padding:14px 16px 14px 14px;box-shadow:var(--sh-sm);display:flex;align-items:center;gap:11px;width:230px}
  .brand .ic{width:38px;height:38px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px;box-shadow:var(--sh-sm)}
  .b1 .ic{background:linear-gradient(135deg,#9db4ff,#6e8bff)}
  .b2 .ic{background:linear-gradient(135deg,#8fd9f2,#5ec8e8)}
  .b3 .ic{background:linear-gradient(135deg,#c6acf6,#a98bf0)}
  .brand .tx .name{font-size:14.5px;font-weight:800}
  .brand .tx .name span{font-size:11px;font-weight:700;color:var(--ink-faint);margin-left:6px}

  /* leaf (성과) */
  .leaf{background:#fff;border-radius:13px;padding:11px 15px;box-shadow:var(--sh-sm);width:255px}
  .leaf .top{font-size:13.5px;font-weight:800}
  .leaf .desc{font-size:11.5px;color:var(--ink-dim);margin-top:3px;line-height:1.45}
  .leaf .tag{display:inline-block;font-size:10px;font-weight:800;padding:2px 8px;border-radius:999px;margin-bottom:5px}
  .b1 .leaf .tag{background:#e9eeff;color:var(--b1-deep)}
  .b2 .leaf .tag{background:#e2f5fb;color:var(--b2-deep)}
  .b3 .leaf .tag{background:#f0e9fd;color:var(--b3-deep)}

  /* dot connector on node edge */
  .pin{position:absolute;width:11px;height:11px;border-radius:50%;background:#fff;box-shadow:var(--sh-sm);transform:translate(-50%,-50%);z-index:3}
  .b1 .pin{border:2px solid var(--b1)} .b2 .pin{border:2px solid var(--b2)} .b3 .pin{border:2px solid var(--b3)}

  .pno{position:absolute;right:28px;bottom:18px;font-size:13px;color:var(--ink-faint);z-index:2}
  .hint{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);font-size:12px;color:#7b86a8}
</style>
</head>
<body>
  <section class="slide">
    <div class="eyebrow">Overview</div>
    <h2 class="head">1분기 한눈에 — 세 개 브랜드, 세 개의 성과</h2>
    <div class="sub">하나의 분기에서 세 브랜드로, 각 브랜드의 핵심 성과로 이어집니다.</div>

    <div class="map" id="map">
      <!-- SVG 연결선 (좌표는 % 기반, JS로 그림) -->
      <svg class="links" id="links" preserveAspectRatio="none"></svg>

      <!-- ROOT -->
      <div class="node root" style="left:13%;top:50%">
        <div class="lbl">2026 1Q</div>
        <div class="ttl"><span class="g">1분기 성과</span></div>
      </div>

      <!-- BRAND 1 -->
      <div class="node brand b1" style="left:45%;top:20%">
        <div class="ic">①</div>
        <div class="tx"><div class="name">넷폼알앤디<span>박람회</span></div></div>
      </div>
      <!-- BRAND 2 -->
      <div class="node brand b2" style="left:45%;top:50%">
        <div class="ic">②</div>
        <div class="tx"><div class="name">POUR공법<span>단가표</span></div></div>
      </div>
      <!-- BRAND 3 -->
      <div class="node brand b3" style="left:45%;top:80%">
        <div class="ic">③</div>
        <div class="tx"><div class="name">아파트스퀘어<span>신규</span></div></div>
      </div>

      <!-- LEAVES -->
      <div class="node leaf b1" style="left:80%;top:20%">
        <span class="tag">넷폼알앤디</span>
        <div class="top">벡스코 박람회 콘텐츠 완비</div>
        <div class="desc">공법·부스 영상, 드론 촬영까지 사전 마감</div>
      </div>
      <div class="node leaf b2" style="left:80%;top:50%">
        <span class="tag">POUR공법</span>
        <div class="top">단가표 발송 체계 정비</div>
        <div class="desc">채널 정비 + AI드론 단가표 신규</div>
      </div>
      <div class="node leaf b3" style="left:80%;top:80%">
        <span class="tag">아파트스퀘어</span>
        <div class="top">신규 브랜드 자산 구축</div>
        <div class="desc">식별 도구부터 디지털 유입까지 가동</div>
      </div>
    </div>
    <div class="pno">02</div>
  </section>

  <div class="hint">샘플 — 「한눈에 보기」를 노드-연결 맵으로 만든 버전입니다</div>

<script>
  // 노드 중심 좌표(%)와 연결관계를 정의해 곡선을 그림
  const links=document.getElementById('links');
  const map=document.getElementById('map');
  // [fromX%, fromY%, toX%, toY%, color, fromHalfW(px), toHalfW(px)]
  function pos(el){const r=el.getBoundingClientRect(),m=map.getBoundingClientRect();
    return {l:(r.left-m.left)/m.width*100,r:(r.right-m.left)/m.width*100,
            t:(r.top-m.top)/m.height*100,cy:((r.top+r.bottom)/2-m.top)/m.height*100};}
  const root=document.querySelector('.root');
  const brands=[...document.querySelectorAll('.brand')];
  const leaves=[...document.querySelectorAll('.leaf')];
  const colors={ '①':'#7e9bff','②':'#62c6e8','③':'#b18cf0' };
  const bc=['#7e9bff','#62c6e8','#b18cf0'];

  function curve(x1,y1,x2,y2){const mx=(x1+x2)/2;return `M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`;}

  function draw(){
    links.innerHTML='';
    const rp=pos(root);
    brands.forEach((b,i)=>{
      const bp=pos(b);
      // root → brand
      const p1=document.createElementNS('http://www.w3.org/2000/svg','path');
      p1.setAttribute('d',curve(rp.r,rp.cy,bp.l,bp.cy));
      p1.setAttribute('stroke',bc[i]);
      links.appendChild(p1);
      // brand → leaf
      const lp=pos(leaves[i]);
      const p2=document.createElementNS('http://www.w3.org/2000/svg','path');
      p2.setAttribute('d',curve(bp.r,bp.cy,lp.l,lp.cy));
      p2.setAttribute('stroke',bc[i]);
      links.appendChild(p2);
    });
    // SVG는 %단위 path를 쓰기 위해 viewBox 0..100
    links.setAttribute('viewBox','0 0 100 100');
  }
  // viewBox 0..100 좌표계를 px와 맞추려면 path 좌표가 %여야 함 → 위 pos가 %를 반환하므로 OK
  window.addEventListener('load',draw);
  window.addEventListener('resize',draw);
</script>
</body>
</html>
